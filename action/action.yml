name: "OfficeCheck"
description: >
  Policy-as-code acceptance gate for AI-edited Office documents.
  Fails the job if the candidate document contains changes the policy
  does not allow.
branding:
  icon: "shield"
  color: "blue"

inputs:
  baseline:
    description: "Path to the baseline (pre-edit) document"
    required: true
  candidate:
    description: "Path to the candidate (post-edit) document"
    required: true
  policy:
    description: "Path to the trusted policy YAML (pin it in the repo; do not let the editing agent write it)"
    required: true
  report:
    description: "Report format: text, json or markdown"
    required: false
    default: "markdown"
  semantic:
    description: "Override semantic mode: off, review or gate"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install OfficeCheck
      shell: bash
      run: python -m pip install --quiet officecheck
    - name: Run check
      shell: bash
      run: |
        ARGS=(check
          --baseline "${{ inputs.baseline }}"
          --candidate "${{ inputs.candidate }}"
          --policy "${{ inputs.policy }}"
          --report "${{ inputs.report }}")
        if [ -n "${{ inputs.semantic }}" ]; then
          ARGS+=(--semantic "${{ inputs.semantic }}")
        fi
        officecheck "${ARGS[@]}" | tee officecheck-report.txt
        STATUS=${PIPESTATUS[0]}
        if [ "${{ inputs.report }}" = "markdown" ]; then
          cat officecheck-report.txt >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$STATUS"
