name: "TemplateGate"
description: >
  Policy-as-code acceptance gate for AI-edited Office documents.
  Fails the job if the candidate document contains changes the policy
  does not allow.
branding:
  icon: "shield"
  color: "blue"

inputs:
  baseline:
    description: "Path to the baseline (pre-edit) document"
    required: true
  candidate:
    description: "Path to the candidate (post-edit) document"
    required: true
  policy:
    description: "Path to the trusted policy YAML (pin it in the repo; do not let the editing agent write it)"
    required: true
  report:
    description: "Report format: text, json or markdown"
    required: false
    default: "markdown"
  semantic:
    description: "Override semantic mode: off, review or gate"
    required: false
    default: ""

outputs:
  passed:
    description: "'true' when the candidate satisfied the policy, 'false' otherwise."
    value: ${{ steps.check.outputs.passed }}
  report-path:
    description: "Path to the report file written by this action."
    value: ${{ steps.check.outputs.report-path }}

runs:
  using: "composite"
  steps:
    # The runner checks out the whole TemplateGate repository for us, so we
    # install the exact revision pinned in `uses:` rather than whatever is on
    # PyPI. action.yml sits in action/, hence the parent directory.
    - name: Install TemplateGate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "${ACTION_PATH}/.."

    # Inputs are passed through env, never interpolated into the script body:
    # a path containing shell metacharacters must not become code.
    - name: Run check
      id: check
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
        POLICY: ${{ inputs.policy }}
        REPORT: ${{ inputs.report }}
        SEMANTIC: ${{ inputs.semantic }}
      run: |
        REPORT_PATH="templategate-report.txt"

        args=(check
          --baseline "$BASELINE"
          --candidate "$CANDIDATE"
          --policy "$POLICY"
          --report "$REPORT"
          --output "$REPORT_PATH")
        if [ -n "$SEMANTIC" ]; then
          args+=(--semantic "$SEMANTIC")
        fi

        # This shell runs with `-eo pipefail`. A FAIL is exit 1, which would
        # abort the step right here and skip the reporting below — the one
        # case where the report matters most. Capture the status instead.
        set +e
        templategate "${args[@]}"
        STATUS=$?
        set -e

        # Exit code 2 is an execution error, in which case no report exists.
        if [ -f "$REPORT_PATH" ]; then
          cat "$REPORT_PATH"
          if [ "$REPORT" = "markdown" ]; then
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

        if [ "$STATUS" -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
        echo "report-path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

        exit "$STATUS"
