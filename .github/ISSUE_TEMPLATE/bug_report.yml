name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach real business documents. Reduce the problem to a
        synthetic file first. If a disallowed change passed the gate, report it
        privately instead: see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did TemplateGate report, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran, plus the policy (inline is fine).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TemplateGate version
      description: Output of `templategate --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true
