name: Publish

# Publishes to PyPI when a v* tag is pushed.
#
# Requires one-time setup before the first tag: on PyPI, add a trusted
# publisher for this project (Manage project -> Publishing) pointing at
# repository kousunh/TemplateGate, workflow "publish.yml", environment
# "pypi". Without it the upload step fails to authenticate — no API token
# is stored in this repository by design.

# Full semver tags only: the floating major tag (v1) that pins the GitHub
# Action in `uses:` lines must not trigger a PyPI upload.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
      contents: write # required to move the floating major tag
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

      # Keep the floating major tag on the latest release, so that
      # `uses: kousunh/TemplateGate/action@v1` runs the same code PyPI
      # ships. Runs only after a successful upload; v1 is excluded from
      # this workflow's trigger, so the push cannot re-trigger it.
      - name: Move the v1 tag to this release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1
          git push -f origin v1
