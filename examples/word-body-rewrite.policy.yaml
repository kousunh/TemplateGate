# Example: an agent may rewrite body paragraphs of a fictional business plan,
# but tables, styles, run formatting, sections and images must stay untouched.
version: 1
target: word
mode: normal_input

allow:
  - selector: "body"
    attributes: [text]

protect:
  # "body" and "p<N>" cover body paragraphs only. Content controls and text
  # boxes are addressed as sdt<N> / textbox<N>, so "*" is what protects them.
  - selector: "*"
    attributes: [style, format, paragraph_format, section, header_footer,
                 table, field, bookmark, content_control,
                 # Rewriting the text is allowed; smuggling it in as a tracked
                 # change, or reordering the document, is not.
                 revision, moved,
                 # The backstop: anything in a paragraph that none of the
                 # above accounts for, such as a dropped footnote reference.
                 markup]

structural:
  images: strict
  tables: strict
  # Rewriting body text must not cost the document its review comments or its
  # embedded attachments — the kind of loss you only notice much later.
  charts: strict
  comments: strict
  embedded: strict          # embedded/OLE objects
  custom_xml: strict
  parts: strict             # styles, numbering, footnotes, settings, theme...
  links: strict             # external hyperlink targets

semantic:
  mode: "off"             # off | review | gate
  # Optional AI review. Set mode to "review" (findings are warnings and never
  # flip PASS/FAIL) or "gate" (findings do affect it), then uncomment below and
  # supply a command — until one is set, a non-off mode only reports a
  # configuration error. TemplateGate does not pin a vendor.
  # provider: command
  # command: "claude -p"  # any CLI that reads the prompt on stdin & prints JSON
  # model: ""             # passed to the command as $TEMPLATEGATE_MODEL
  # checks:
  #   - "日付や期間に矛盾がないこと"
  #   - "旧名称が本文に残っていないこと"
