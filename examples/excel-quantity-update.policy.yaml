# Example: an agent is allowed to update quantity cells on the plan sheet,
# and nothing else. Formulas, formats, print layout and sheet structure are
# all locked. (All names here are fictional.)
version: 1
target: excel
mode: normal_input

allow:
  - selector: "計画表!B4:B6"
    attributes: [value]
  # Nothing needs adding here for the cached results of dependent formulas.
  # Excel refreshes those on save and a library discards them, and either way
  # the formula itself is untouched, so `recalculation: ignore` below treats
  # them as recalculation rather than as an edit. Chart caches are not cells
  # and do need allowing, if the workbook has charts and Excel did the saving:
  #
  #   - selector: "package#charts:*"    # caches Excel refreshes on save
  #     attributes: [charts]

protect:
  - selector: "*"
    attributes: [formula, format, merge, conditional_formatting,
                 data_validation, header_footer, print_settings, vba,
                 # A quantity edit must not hide a row, unlock the sheet, or
                 # switch the workbook to manual calculation — which would
                 # leave every total showing a stale answer.
                 layout, protection, sheet_settings]

structural:
  sheets: strict
  images: strict
  defined_names: strict
  # A quantity edit has no business touching any of these. They are strict by
  # default; spelled out here because losing one is the quiet failure — the
  # workbook still opens, the numbers are still right, and the chart is gone.
  charts: strict
  pivot_tables: strict
  drawings: strict          # shapes and textboxes
  comments: strict
  embedded: strict          # embedded/OLE objects
  custom_xml: strict
  parts: strict             # every other part of the file, known or not
  links: strict             # a hyperlink repointed while its text stays put

# A formula's stored answer may be recomputed; the formula itself may not,
# and `formula` above catches one replaced by a literal either way.
recalculation: ignore

semantic:
  mode: "off"
